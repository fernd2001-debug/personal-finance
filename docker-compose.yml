services:
  mysql:
    image: mysql:8.4
    container_name: personal-finance-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: personal_finance
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "3306:3306"
    volumes:
      - personal_finance_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  personal_finance_data:
